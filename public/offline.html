<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D3B66" />
    <title>FaithHaven is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FDF9EC; color: #17324D; font: 16px system-ui, sans-serif; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 .75rem; font-size: 1.8rem; }
      p { line-height: 1.6; }
      button { margin-top: 1rem; border: 0; border-radius: .6rem; padding: .75rem 1rem; background: #0D3B66; color: white; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are currently offline</h1>
      <p>FaithHaven can show public application resources while offline, but your private account data and new requests are not stored on this device.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
